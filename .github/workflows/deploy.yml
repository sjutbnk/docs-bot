name: Deploy TG Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code check
        uses: actions/checkout@v4

      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST != '' && secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USERNAME != '' && secrets.SSH_USERNAME || secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_KEY != '' && secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          script: |
            cd docs-bot/
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
