name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q bot tests

      - name: Import application modules
        env:
          PYTHONPATH: bot
        run: >-
          python -c
          "import config, utils, mappings, prompts, docx_populator, generator,
          supply_generator, extractor, handlers, bot"

      - name: Run offline smoke tests
        env:
          PYTHONPATH: bot
        run: python -m pytest -q tests/test_supply_generation.py
